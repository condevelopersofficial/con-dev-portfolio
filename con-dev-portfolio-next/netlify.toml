## Netlify configuration for the Next.js portfolio (static export).
## Used when this directory is set as the site's base/root in Netlify.
## The repository-root netlify.toml mirrors these settings with base = "con-dev-portfolio-next".

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Next.js 14 requires Node >= 18.17
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
