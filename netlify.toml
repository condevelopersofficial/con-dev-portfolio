## This is the configuration file for Netlify
## https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Next.js 14 requires Node >= 18.17
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

## next.config.js uses `output: 'export'`, so Netlify hosts the pre-rendered
## static files in `out/` - no serverless functions are needed.

# Long-lived caching for fingerprinted build assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images rarely change; keep them cached for a week
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
